[tools]
node = "22"
pnpm = "10.34.5"

[hooks]
postinstall = [{ task = "install:js" }]

[tasks."install:js"]
description = "Install JS packages"
run = "pnpm install --frozen-lockfile"

[tasks.server]
alias = "s"
description = "Start the development server on http://127.0.0.1:3000"
depends = ["install:js"]
run = "pnpm start"
env = { BROWSER = "none" }

[tasks.test]
description = "Run the test suite once"
depends = ["install:js"]
run = "pnpm test --watchAll=false"
env = { CI = "true" }
